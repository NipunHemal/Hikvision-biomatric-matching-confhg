# ── ISUP CMS listener (devices dial in here) ──
# 0.0.0.0 = listen on all interfaces. Devices' "Server IP Address" points here.
CmsServerIP=0.0.0.0
CmsServerPort=7660

# ISUP 5.0 login key — MUST match the "Encryption Key" set on each device's
# ISUP config screen. 8-16 chars.
ISUPKey=Hrm12345Key

# ── Alarm/event server (punch events arrive here over ISUP) ──
# Point these at THIS machine's reachable IP (not 0.0.0.0 — the device connects to it).
AlarmServerIP=161.97.135.43
AlarmServerTCPPort=7663
AlarmServerUDPPort=7662
AlarmServerType=1

# Picture storage server (face/fp images). Optional; leave as-is if unused.
PicServerIP=127.0.0.1
PicServerPort=6011
PicServerType=0

# DAS (device access server) — for redirect scenarios; single-server can reuse CMS.
DasServerIP=161.97.135.43
DasServerPort=7660

# ── This server's own HTTP API (the Node HRM calls this) ──
HttpApiPort=8090

# Where to forward punch events (your HRM webhook). Leave blank to only log them.
HrmEventUrl=

# HRM API auth — comma-separated Bearer tokens. Empty = auth OFF (dev only).
API_TOKENS=

# In-memory simulated devices (test the API without hardware). Keep false in prod.
SIM_ENABLED=false
