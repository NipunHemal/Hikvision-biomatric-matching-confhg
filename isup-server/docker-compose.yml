# Biometric Device Hub — docker-compose deployment.
#
#   docker compose up -d --build
#
# Config is via environment variables (below) — no need to edit files. The app
# reads env first, then config.properties, then defaults. It starts even if the
# native ISUP libs are missing (HTTP API stays up; add the Linux .so to enable
# device registration).
services:
  hub:
    build: .
    container_name: biometric-hub
    restart: unless-stopped
    ports:
      - "7660:7660"       # ISUP CMS — devices register here (raw TCP)
      - "7663:7663"       # alarm TCP — punch events
      - "7662:7662/udp"   # alarm UDP
      - "8090:8090"       # HTTP API — the HRM calls this
    environment:
      # ── set these (override from the Dokploy Environment tab) ──
      # These read the UI env var if set, else the default after ":-".
      ISUP_KEY: "${ISUP_KEY:-Hrm12345Key}"
      # HRM API Bearer token(s), comma-separated. REQUIRED in production.
      API_TOKENS: "${API_TOKENS:-hub_tGCxvFTLuEG3SSHFWikXVnvxxCy1QdYW}"
      # Enable in-memory simulated devices (test the API without hardware). Keep false in prod.
      SIM_ENABLED: "${SIM_ENABLED:-false}"
      # The address DEVICES dial — the server's PUBLIC IP or domain (not internal).
      ALARM_SERVER_IP: "${ALARM_SERVER_IP:-161.97.135.43}"
      DAS_SERVER_IP: "${DAS_SERVER_IP:-161.97.135.43}"
      # ── usually leave as default ──
      CMS_SERVER_PORT: "7660"
      DAS_SERVER_PORT: "7660"
      ALARM_SERVER_TCP_PORT: "7663"
      ALARM_SERVER_UDP_PORT: "7662"
      HTTP_API_PORT: "8090"
      # Where to forward punch events (optional):
      # HRM_EVENT_URL: "https://hrm.example.com/api/events"
    volumes:
      - ./EHomeSDKLog:/app/EHomeSDKLog
