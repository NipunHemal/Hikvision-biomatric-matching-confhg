# Biometric Device Hub — docker-compose deployment.
#
#   docker compose up -d --build
#
# Config is via environment variables (below) — no need to edit files. The app
# reads env first, then config.properties, then defaults. It starts even if the
# native ISUP libs are missing (HTTP API stays up; add the Linux .so to enable
# device registration).
services:
  hub:
    build: .
    container_name: biometric-hub
    restart: unless-stopped
    # Publishing ports to the host. NOTE: this does NOT open the host OS firewall
    # or the cloud-provider firewall — 7663/7662 are the ones for device EVENTS
    # (card taps / punches). If events don't arrive, run scripts/open-ports.sh on
    # the server AND open 7663/tcp + 7662/udp in the cloud provider's panel.
    ports:
      - "0.0.0.0:7660:7660"       # ISUP CMS — devices register here (raw TCP)
      - "0.0.0.0:7663:7663"       # alarm TCP — punch / card-tap events  ← events
      - "0.0.0.0:7662:7662/udp"   # alarm UDP — events (fallback)        ← events
      - "0.0.0.0:8090:8090"       # HTTP API — the HRM calls this
    # Every value below reads the Dokploy Environment-tab variable if set, else the
    # default after ":-". So to change any config: set the var in the Dokploy UI
    # (same name) and redeploy — no file edits needed.
    environment:
      # ── commonly changed ──
      ISUP_KEY: "${ISUP_KEY:-Hrm12345Key}"                 # device Encryption Key (must match)
      API_TOKENS: "${API_TOKENS:-hub_tGCxvFTLuEG3SSHFWikXVnvxxCy1QdYW}"  # HRM Bearer token(s), comma-sep
      ALARM_SERVER_IP: "${ALARM_SERVER_IP:-161.97.135.43}" # server PUBLIC IP/domain devices dial
      DAS_SERVER_IP: "${DAS_SERVER_IP:-161.97.135.43}"     # usually same as ALARM_SERVER_IP
      HRM_EVENT_URL: "${HRM_EVENT_URL:-}"                   # forward punch events here (blank=log only)
      SIM_ENABLED: "${SIM_ENABLED:-false}"                 # in-memory test devices; false in prod
      # ── event polling (attendance/card taps) ──
      EVENT_POLL_ENABLED: "${EVENT_POLL_ENABLED:-1}"       # 1=on, 0=off
      EVENT_POLL_INTERVAL_SEC: "${EVENT_POLL_INTERVAL_SEC:-15}"
      EVENT_POLL_LOOKBACK_SEC: "${EVENT_POLL_LOOKBACK_SEC:-120}"
      EVENT_POLL_TZ: "${EVENT_POLL_TZ:-+05:30}"            # device timezone offset (must match!)
      # ── behaviour tuning (rarely changed) ──
      SDK_LOG_LEVEL: "${SDK_LOG_LEVEL:-1}"                 # 0-none 1-error 2-info 3-debug
      CARD_CAPTURE_WAIT_MS: "${CARD_CAPTURE_WAIT_MS:-45000}"
      ALARM_REUSE_CMS_PORT: "${ALARM_REUSE_CMS_PORT:-1}"
      ALARM_SERVER_TYPE: "${ALARM_SERVER_TYPE:-2}"
      # ── ports (change only if you remap the published ports above) ──
      CMS_SERVER_PORT: "${CMS_SERVER_PORT:-7660}"
      DAS_SERVER_PORT: "${DAS_SERVER_PORT:-7660}"
      ALARM_SERVER_TCP_PORT: "${ALARM_SERVER_TCP_PORT:-7663}"
      ALARM_SERVER_UDP_PORT: "${ALARM_SERVER_UDP_PORT:-7662}"
      HTTP_API_PORT: "${HTTP_API_PORT:-8090}"
    volumes:
      - ./EHomeSDKLog:/app/EHomeSDKLog
